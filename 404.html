<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8f5;
            color: #3d2520;
            min-height: 100vh;
        }

        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .error-container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        /* Logo */
        .logo {
            display: inline-block;
            text-decoration: none;
            color: #3d2520;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .logo span {
            color: #d8899b;
        }

        /* Cake */
        .cake-wrapper {
            width: 180px;
            height: 160px;
            margin: 0 auto 25px;
            position: relative;
        }

        .cake {
            position: absolute;
            left: 50%;
            bottom: 15px;
            transform: translateX(-50%);
            width: 145px;
            height: 75px;
            background: #e9a6b5;
            border-radius: 12px 12px 20px 20px;
            box-shadow: inset 0 -12px 0 rgba(0, 0, 0, 0.08);
        }

        .cake::before {
            content: "";
            position: absolute;
            top: -18px;
            left: 0;
            width: 145px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
        }

        .cake::after {
            content: "•  •  •";
            position: absolute;
            color: #c56f85;
            font-size: 22px;
            letter-spacing: 5px;
            left: 32px;
            top: 28px;
        }

        .candle {
            position: absolute;
            width: 9px;
            height: 38px;
            background: #f5c85b;
            border-radius: 5px;
            top: 25px;
        }

        .candle:nth-child(1) {
            left: 58px;
        }

        .candle:nth-child(2) {
            left: 85px;
        }

        .candle:nth-child(3) {
            left: 112px;
        }

        .flame {
            position: absolute;
            width: 12px;
            height: 17px;
            background: #ffad42;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            top: 7px;
        }

        .flame:nth-child(4) {
            left: 57px;
        }

        .flame:nth-child(5) {
            left: 84px;
        }

        .flame:nth-child(6) {
            left: 111px;
        }

        /* 404 */
        .error-number {
            font-size: clamp(90px, 18vw, 180px);
            line-height: 0.9;
            font-weight: 800;
            color: #d8899b;
            letter-spacing: -8px;
        }

        .error-title {
            margin-top: 25px;
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 700;
        }

        .error-text {
            max-width: 560px;
            margin: 15px auto 0;
            font-size: 17px;
            line-height: 1.7;
            color: #765e58;
        }

        /* Buttons */
        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            padding: 14px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-primary {
            background: #d8899b;
            color: #fff;
        }

        .btn-primary:hover {
            background: #c56f85;
            transform: translateY(-2px);
        }

        .btn-secondary {
            border: 1px solid #d8899b;
            color: #c56f85;
            background: transparent;
        }

        .btn-secondary:hover {
            background: #f9e2e7;
            transform: translateY(-2px);
        }

        /* Helpful links */
        .quick-links {
            margin-top: 45px;
            padding-top: 25px;
            border-top: 1px solid #ead8d4;
        }

        .quick-links p {
            font-size: 14px;
            color: #8a7069;
            margin-bottom: 12px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .links a {
            color: #765e58;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .links a:hover {
            color: #d8899b;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .error-page {
                padding: 25px 16px;
            }

            .logo {
                font-size: 24px;
                margin-bottom: 25px;
            }

            .cake-wrapper {
                transform: scale(0.85);
                margin-bottom: 5px;
            }

            .error-number {
                font-size: 105px;
                letter-spacing: -5px;
            }

            .error-title {
                margin-top: 18px;
                font-size: 28px;
            }

            .error-text {
                font-size: 15px;
                line-height: 1.6;
                padding: 0 8px;
            }

            .actions {
                flex-direction: column;
                width: 100%;
                gap: 12px;
            }

            .btn {
                width: 100%;
                max-width: 280px;
            }

            .quick-links {
                margin-top: 35px;
            }

            .links {
                gap: 15px;
            }
        }

        @media (max-width: 360px) {

            .cake-wrapper {
                transform: scale(0.72);
                height: 135px;
            }

            .error-number {
                font-size: 90px;
            }

            .error-title {
                font-size: 25px;
            }

            .error-text {
                font-size: 14px;
            }

            .quick-links {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="error-page">

        <div class="error-container">

            <!-- Logo -->
            <a href="index.html" class="logo">
                <img src="./logo/Untitled design.webp" alt="Sweet Crumbs Logo" width="160px" height="60px" style="object-fit: cover;">
            </a>

            <!-- Cake Illustration -->
            <div class="cake-wrapper">

                <div class="candle"></div>
                <div class="candle"></div>
                <div class="candle"></div>

                <div class="flame"></div>
                <div class="flame"></div>
                <div class="flame"></div>

                <div class="cake"></div>

            </div>

            <!-- Error -->
            <div class="error-number">404</div>

            <h1 class="error-title">
                Oops! This page is missing.
            </h1>

            <p class="error-text">
                Looks like this page has wandered out of our bakery.
                Don't worry — there are plenty of delicious cakes and
                sweet treats waiting for you.
            </p>

            <!-- Actions -->
            <div class="actions">

                <a href="index.html" class="btn btn-primary">
                    Back to Home
                </a>

                <a href="shop.html" class="btn btn-secondary">
                    Explore Cakes
                </a>

            </div>

            <!-- Quick Links -->
            <div class="quick-links">

                <p>Looking for something else?</p>

                <div class="links">
                    <a href="index.html">Home</a>
                    <a href="shop.html">Cakes</a>
                    <a href="about.html">About Us</a>
                    <a href="contact.html">Contact</a>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
